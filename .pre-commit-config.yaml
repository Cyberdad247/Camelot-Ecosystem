# Pre-commit hooks for CAMELOT-OS
#
# Install the framework once per developer:
#     pip install pre-commit
#     pre-commit install
#
# Run all hooks on the entire repo:
#     pre-commit run --all-files
#
# Run only this hook:
#     pre-commit run infra-purge-rollback-verify
#
# The infra-purge-rollback-verify hook enforces the verification contract
# declared in docs/plans/IMPLEMENTATION_INFRA_PURGE.md, Section 6.1.
# It refuses any commit that touches purge-affected paths unless:
#   * the rollback files exist on disk,
#   * the rollback files are git-tracked (not just working-tree-only),
#   * the unreachable-blob reachability check passes advisably,
#   * a clean PASS message is printed on success.

repos:
  - repo: local
    hooks:
      - id: infra-purge-rollback-verify
        name: Verify infra_purge rollback contract (Redis/Qdrant removal)
        description: >-
          Enforces docs/plans/IMPLEMENTATION_INFRA_PURGE.md Section 6.1.
          Block any commit touching purge-affected paths unless the rollback
          safety net is intact (local backup files exist on disk, are
          git-tracked, and are recoverable against a future 'git gc').
          Delegates to scripts/check_infra_purge_rollback.sh.
        entry: scripts/check_infra_purge_rollback.sh
        language: system
        pass_filenames: false
        files: |
          (?x)^(
              99_ARCHIVE/infra_purge_backup/.*\.py
            | 01_KERNEL/memory/(redis_store|qdrant_store|local_store|local_sovereign_store|agent_memory)\.py
            | 01_KERNEL/merlin/(merlin_omega|rag/chronos_haystack)\.py
            | 01_KERNEL/config/registry/chimera_unified_kernel\.json
            | control_plane/boot_sequence\.py
            | bin/awaken\.py
            | (requirements\.txt|pyproject\.toml)
            | docs/plans/IMPLEMENTATION_INFRA_PURGE\.md
          )$
      - id: bifrost-audit-verify
        name: Verify Bifrost dispatch audit (T1-T5 regression gate)
        description: >-
          Re-runs the verify_cmd strings from
          control_plane/bifrost_triage_swarm.TASK_PLAN against the
          current code. Enforces the 2026-06-24 audit: dead ollama/hermes
          branches stay dead, http strategy stays implemented, terminal
          model stays reconciled, ledger stays honest, security
          verification.md stays present. Mirrors the GitHub Actions
          `bifrost-audit` job in .github/workflows/verify_os.yml.
        entry: python scripts/check_bifrost_audit.py
        language: system
        pass_filenames: false
        files: |
          (?x)^(
              control_plane/dispatch/bifrost\.py
            | control_plane/dispatch/bifrost_integration\.py
            | control_plane/dispatch/bifrost_triage_swarm\.py
            | control_plane/bifrost_triage_swarm\.py
            | docs/reports/bifrost_triage_.*/verification\.md
            | scripts/check_bifrost_audit\.py
          )$
      - id: excalibur-pyinstaller-filter-parity
        name: Verify EXCALIBUR PyInstaller CRLF tuple ↔ dorny filter parity
        description: >-
          Enforces that the EXCALIBUR PyInstaller smoke's CRLF pre-check
          `watched = (...)` tuple and the dorny/paths-filter
          `excalibur-paths` list inside .github/workflows/verify_os.yml
          describe the SAME set of files. Catches the case where a
          contributor updates one block and forgets the other, which
          would silently let CRLF contamination slip past the pre-build
          gate (when only dorny grew) OR let build changes slip past CI
          (when only the CRLF tuple grew). Mirrors the GitHub Actions
          `excalibur-filter-parity` job in verify_os.yml Stage 12.
        entry: python scripts/check_excalibur_filter_parity.py
        language: system
        pass_filenames: false
        files: |
          (?x)^(
              \.github/workflows/verify_os\.yml
            | scripts/check_excalibur_filter_parity\.py
          )$
      - id: omnivoice-router-build-parity
        name: Verify OmniVoice Router build artifact parity
        description: >-
          Enforces that the COMMITTED
          02_FORGE/KINETIC_ARMORY/omnivoice-router/omnivoice-router.js build
          artifact still matches its TypeScript source. That file is the
          package `main` and nothing regenerates it automatically; as of
          2026-09-14 it was seven weeks stale and contained none of the
          /ingest_pcm HTTP ingest stack. Compares UPPER_SNAKE constants, route
          paths, and response error identifiers. Mirrors the GitHub Actions
          `omnivoice-router-parity` job in .github/workflows/verify_os.yml.
        entry: python scripts/check_omnivoice_router_build.py
        language: system
        pass_filenames: false
        files: |
          (?x)^(
              02_FORGE/KINETIC_ARMORY/omnivoice-router/omnivoice-router\.(ts|js)
            | scripts/check_omnivoice_router_build\.py
          )$
      - id: generated-artifact-parity
        name: Verify generated artifact parity (HELIO_PATCH + tsc emits)
        description: >-
          Enforces that committed generated artifacts still match the inputs
          that produce them, by REGENERATING and comparing — not merely by
          running the generator and trusting its exit code.

          Why: on 2026-09-14 the committed HELIO_PATCH.json certified
          design_tokens_conformance as PASS with zero violations while a fresh
          regen produced FAIL with three real violations in
          apps/pwa/src/components/LakishaHUD.tsx. The pre-existing
          scripts/ops/check-helio-dry.sh could not have caught it: it asserted a
          top-level `.status` key that has never existed in the emitted schema,
          so it was incapable of passing for any input.

          Covers two strategies (see the script docstring): `regen` for
          HELIO_PATCH.json, and `tsc` for committed *.js build outputs
          (edge-router.js, extensions/camelot-vscode/out/extension.js). The
          OmniVoice router artifact has its own sibling hook
          `omnivoice-router-build-parity`. Mirrors the GitHub Actions
          `generated-artifact-parity` job in .github/workflows/verify_os.yml.
        entry: python scripts/check_generated_artifact_parity.py
        language: system
        pass_filenames: false
        files: |
          (?x)^(
              HELIO_PATCH\.json
            | scripts/regen-helio-patch\.mjs
            | scripts/check_generated_artifact_parity\.py
            | apps/pwa/src/components/LakishaHUD\.tsx
            | apps/pwa/src/app/page\.tsx
            | apps/bifrost/src/(security|server|mcp)\.ts
            | 02_FORGE/KINETIC_ARMORY/edge-router/(edge-router\.(ts|js)|tsconfig\.json)
            | extensions/camelot-vscode/(src/.*\.ts|out/.*\.js|tsconfig\.json)
          )$
      - id: provenance-mirror-sync
        name: Automatically sync all 4 PROVENANCE_LEDGER.md mirrors
        description: >-
          Enforces that any modification to root PROVENANCE_LEDGER.md
          immediately cascades to 03_VAULT, docs, and 03_VAULT/training/configs
          with updated cryptographic hash receipts and defense grid sync status.
        entry: python scripts/sync_provenance.py
        language: system
        pass_filenames: false
        files: ^PROVENANCE_LEDGER\.md$
      - id: graft-graph-freshness
        name: Graft context-graph freshness (advisory)
        description: >-
          Reports graft/ staleness via `graft check` before a commit touching
          indexed code. Advisory by design: every degraded outcome (CLI
          missing, STALE, native abort, timeout) exits 0 so the commit still
          lands — graft's tree-sitter pass can abort with 0xC0000409 on
          memory-pressured hosts (upstream NanoNets/Graft#122), and the graph
          is a git-ignored regenerable cache. Use
          `python scripts/check_graft_graph.py --strict` to enforce instead.
        entry: python scripts/check_graft_graph.py
        language: system
        pass_filenames: false
        files: |
          (?x)^(
              control_plane/.*\.py
            | squires/.*\.py
            | 01_KERNEL/.*\.py
            | scripts/check_graft_graph\.py
          )$

