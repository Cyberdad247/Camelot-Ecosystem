version: '3.8'

# Observability Stack for CAMELOT-OS
# Includes: Prometheus, Grafana, Jaeger, AlertManager, Redis exporter

services:
  # ── Prometheus ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: camelot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - camelot-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Grafana ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: camelot-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - camelot-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── AlertManager ────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: camelot-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - camelot-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Jaeger ──────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: camelot-jaeger
    ports:
      - "6831:6831/udp"  # Jaeger agent (UDP)
      - "16686:16686"    # Jaeger UI
      - "14269:14269"    # Prometheus metrics
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    volumes:
      - jaeger_data:/badger/data
    networks:
      - camelot-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis Exporter ──────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: camelot-redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis-1:6379,redis-2:6379,redis-3:6379
    networks:
      - camelot-observability
    restart: unless-stopped
    depends_on:
      - redis-1
      - redis-2
      - redis-3

  # ── Redis Cluster Nodes ─────────────────────────────────────────────
  redis-1:
    image: redis:7-alpine
    container_name: camelot-redis-1
    ports:
      - "6379:6379"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    volumes:
      - redis_1_data:/data
    networks:
      - camelot-observability
    restart: unless-stopped

  redis-2:
    image: redis:7-alpine
    container_name: camelot-redis-2
    ports:
      - "6380:6379"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    volumes:
      - redis_2_data:/data
    networks:
      - camelot-observability
    restart: unless-stopped

  redis-3:
    image: redis:7-alpine
    container_name: camelot-redis-3
    ports:
      - "6381:6379"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    volumes:
      - redis_3_data:/data
    networks:
      - camelot-observability
    restart: unless-stopped

  # ── Qdrant Vector DB ────────────────────────────────────────────────
  qdrant-1:
    image: qdrant/qdrant:latest
    container_name: camelot-qdrant-1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_1_data:/qdrant/storage
    networks:
      - camelot-observability
    restart: unless-stopped

  qdrant-2:
    image: qdrant/qdrant:latest
    container_name: camelot-qdrant-2
    ports:
      - "6334:6333"
    volumes:
      - qdrant_2_data:/qdrant/storage
    networks:
      - camelot-observability
    restart: unless-stopped

  qdrant-3:
    image: qdrant/qdrant:latest
    container_name: camelot-qdrant-3
    ports:
      - "6335:6333"
    volumes:
      - qdrant_3_data:/qdrant/storage
    networks:
      - camelot-observability
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  jaeger_data:
  redis_1_data:
  redis_2_data:
  redis_3_data:
  qdrant_1_data:
  qdrant_2_data:
  qdrant_3_data:

networks:
  camelot-observability:
    driver: bridge

# ── Usage ────────────────────────────────────────────────────────────
# Start stack:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f
#
# Access services:
#   Prometheus: http://localhost:9090
#   Grafana: http://localhost:3000 (admin/admin123)
#   Jaeger: http://localhost:16686
#   AlertManager: http://localhost:9093
#
# Stop stack:
#   docker-compose down
