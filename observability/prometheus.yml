# Prometheus configuration for CAMELOT-OS — NO-DOCKER / native.
#
# Targets are localhost: the metrics daemon (control_plane.cluster.metrics_daemon)
# binds a single aggregated /metrics endpoint on :8000 and already attaches
# per-node labels, so one scrape target covers the local cluster. Run native
# Prometheus from this directory:  prometheus --config.file=prometheus.yml
# (see OBSERVABILITY_SETUP.md → No-Docker Quick Start). No containers, per the
# Microcubic VM Law.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'camelot'
    environment: 'local'

# Alerting — optional. Run a native AlertManager on :9093 to enable; if it is not
# running, Prometheus simply reports the alertmanager as down (rules still fire).
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - '127.0.0.1:9093'

# Alert rules (resolved relative to Prometheus's working directory; run from this
# observability/ folder, or pass an absolute path).
rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # ── CAMELOT-OS aggregated metrics (metrics_daemon, per-node labels built in) ──
  - job_name: 'camelot'
    static_configs:
      - targets: ['127.0.0.1:8000']

  # ── Per-node operation metrics (node_daemon exposes on node_port + 300) ──
  - job_name: 'camelot-nodes'
    static_configs:
      - targets: ['127.0.0.1:8743']
        labels: {instance: 'node_1'}
      - targets: ['127.0.0.1:8744']
        labels: {instance: 'node_2'}
      - targets: ['127.0.0.1:8745']
        labels: {instance: 'node_3'}

  # ── Prometheus self-monitoring ──────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']
