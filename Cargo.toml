[workspace]
resolver = "2"
members = [
    "01_KERNEL/core/aegis_shield",
    "01_KERNEL/reasoning/ouroboros_engine",
    "01_KERNEL/EXCALIBUR/kernel_api_bridge",
    "01_KERNEL/senses/morgana_bridge",
    "02_FORGE/kinetic/actor",
    "02_FORGE/kinetic/contracts",
    "02_FORGE/kinetic/cribo",
    "02_FORGE/kinetic/omni_nexus_ide",
    "02_FORGE/kinetic/pmcp",
    "02_FORGE/kinetic/rotel",
    "04_KINETIC/squires_rs",
    "04_KINETIC/memory_palace",
    "control_plane/rtk",
    "kinetic_edge/camelot_edge",
    "kinetic_edge/pqcrypto",
    "kinetic_edge/swarm_spawner",
    "wasm/ledger-engine",
    "crates/camelot-vkg-crystal",
    "packages/crawler",
    "packages/harness-forge"
]
exclude = [
    "03_VAULT/runtime_state/nano_swarm_generated/Node_B_Bifrost/source",
    "03_VAULT/runtime_state/nano_swarm_generated/Node_D_MicroVM/source",
    "02_FORGE/generated/ukg_omega_glyph_v1000/Node_B_Bifrost",
    "02_FORGE/generated/ukg_omega_glyph_v1000/Node_D_MicroVM"
]

[workspace.lints.rust]
dead_code = "warn"
unused_variables = "warn"
unused_imports = "warn"
unused_mut = "warn"

[profile.dev]
opt-level = 0
debug = 0
codegen-units = 1

[profile.test]
opt-level = 1
debug = 0
codegen-units = 1
