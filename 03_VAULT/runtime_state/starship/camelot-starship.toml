# Camelot-OS Starship prompt profile
# Generated by: python -m control_plane.camelot_cli starship assimilate
# Activation is explicit. Set STARSHIP_CONFIG to this file, then run starship init.

add_newline = false
scan_timeout = 30
command_timeout = 900
format = "$directory$git_branch$git_status$python$rust$nodejs$custom.camelot$line_break$character"

[character]
success_symbol = "[CAMELOT>](bold green)"
error_symbol = "[CAMELOT!](bold red)"

[directory]
truncation_length = 4
style = "bold cyan"

[git_branch]
symbol = "git:"
style = "bold yellow"

[git_status]
style = "yellow"

[python]
symbol = "py:"
style = "green"

[rust]
symbol = "rs:"
style = "red"

[nodejs]
symbol = "node:"
style = "green"

[custom.camelot]
command = "python C:\\Users\\vizio\\CAMELOT_OS\\bin\\starship_camelot_module.py"
when = "python C:\\Users\\vizio\\CAMELOT_OS\\bin\\starship_camelot_module.py --available"
format = " [$output](bold blue)"
description = "Camelot cockpit health summary"
