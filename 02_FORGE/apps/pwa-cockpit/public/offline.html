<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1112" />
    <title>Anya | Offline</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI Variable", system-ui, sans-serif; background: #070a0b; color: #e7efed; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(440px, 100%); border-top: 1px solid #497d73; padding-top: 24px; }
      p { color: #91a39f; line-height: 1.6; }
      strong { color: #77e2cd; font: 600 12px ui-monospace, monospace; text-transform: uppercase; letter-spacing: .12em; }
      button { border: 1px solid #34554f; background: #101717; color: #e7efed; padding: 10px 14px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <strong>Edge shell active</strong>
      <h1>Anya is offline.</h1>
      <p>The local interface is available, but live Camelot services cannot be reached. Reconnect to the sovereign mesh and retry.</p>
      <button type="button" onclick="location.reload()">Retry connection</button>
    </main>
  </body>
</html>
