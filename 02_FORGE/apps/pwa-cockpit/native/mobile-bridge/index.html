<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080c0d" />
    <title>Camelot Mobile Bridge</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <header><span>A</span><div><p>ANYA MOBILE COMPANION</p><h1>Device Bridge</h1></div><i id="state-dot"></i></header>
      <section><p>DEVICE IDENTITY</p><strong id="fingerprint">Creating non-extractable identity...</strong><textarea id="public-key" readonly aria-label="Device public key"></textarea><button id="copy-key">Copy enrollment key</button></section>
      <section><label for="endpoint">Cockpit endpoint</label><input id="endpoint" type="url" value="https://cybertronia.tailcd0c29.ts.net" /><label for="device-id">Enrolled device ID</label><input id="device-id" placeholder="dev-..." /><button id="connect">Check signed queue</button><label class="toggle"><input id="continuous" type="checkbox" /> Poll every 10 seconds</label></section>
      <section class="capabilities"><p>NATIVE ALLOWLIST</p><div><span>Haptics</span><span>Notification</span><span>Approved URL</span></div></section>
      <output id="result" aria-live="polite">Enroll this key in Device Hall, then enter its device ID.</output>
    </main>
  </body>
</html>
