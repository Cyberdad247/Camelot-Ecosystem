[package]
name = "excalibur-ouroboros"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ouroboros"
path = "src/main.rs"

[dependencies]
thiserror  = "2.0"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid       = { version = "1", features = ["v4"] }
anyhow     = "1"
