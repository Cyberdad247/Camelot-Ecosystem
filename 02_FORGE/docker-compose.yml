services:
  # --- L3: THE BRAIN ---
  merlin:
    build: ./01_KERNEL
    container_name: merlin_brain
    volumes:
      - ./.hive:/app/.hive
      - ./PROVENANCE_LEDGER.md:/app/PROVENANCE_LEDGER.md
      - ./02_FORGE:/app/forge
    ports:
      - "18000:8000"
    environment:
      - MODE=TITAN_CONDUCTOR
    depends_on:
      - memory
    networks:
      - camelot_net

  # --- L2: THE KINETIC TRINITY ---
  # NOTE: Saltare runs as CLIProxyAPI (native Go binary on :8080), not as a container.
  # Config: ~/.camelot/config/saltare.toml | Binary: ~/CLIProxyAPI/cli-proxy-api.exe

  rotel:
    build: ./02_FORGE/kinetic/rotel
    container_name: rotel_telemetry
    ports:
      - "4317:4317"
    tty: true
    command: tail -f /dev/null
    networks:
      - camelot_net

  cribo:
    build: ./02_FORGE/kinetic/cribo
    container_name: cribo_bundler
    volumes:
      - ./02_FORGE:/app/forge
    tty: true
    command: tail -f /dev/null
    networks:
      - camelot_net

  # --- L7: THE VOICE ---
  sonus:
    build: ./tools/sir_sonus
    container_name: sir_sonus
    ports:
      - "5050:5050"
    networks:
      - camelot_net

  # --- L4: THE SEMANTIC MEMORY ---
  memory:
    image: qdrant/qdrant
    container_name: camelot_memory
    ports:
      - "6333:6333"
    networks:
      - camelot_net

  # --- INFRA: RUSTDESK (REMOTE ACCESS) ---
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r localhost:21117
    volumes:
      - ./02_FORGE/kinetic/rustdesk-server/data:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - hbbr
    networks:
      - camelot_net
    restart: unless-stopped
    profiles:
      - kinetic # Run with 'docker compose --profile kinetic up'

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./02_FORGE/kinetic/rustdesk-server/data:/root
    ports:
      - "21117:21117"
      - "21119:21119"
    networks:
      - camelot_net
    restart: unless-stopped
    profiles:
      - kinetic

  # --- DEERFLOW 2.0: SANDBOXED EXECUTION ---
  deerflow-sandbox:
    image: python:3.11-slim
    container_name: deerflow_sandbox
    working_dir: /workspace
    volumes:
      - ./logs/deerflow:/workspace/output
    environment:
      - SANDBOX_MODE=true
      - PYTHONDONTWRITEBYTECODE=1
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    networks:
      - camelot_net
    profiles:
      - sarda  # Run with 'docker compose --profile sarda up'
    command: ["python", "-c", "print('DeerFlow sandbox ready'); import time; time.sleep(86400)"]

  # --- DEERFLOW 2.0: RUST COMPILATION SANDBOX ---
  deerflow-sandbox-rust:
    image: rust:1.78-slim
    container_name: deerflow_sandbox_rust
    working_dir: /workspace
    volumes:
      - ./logs/deerflow:/workspace/output
    environment:
      - SANDBOX_MODE=true
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    networks:
      - camelot_net
    profiles:
      - sarda
    command: ["tail", "-f", "/dev/null"]

  # --- DEERFLOW 2.0: GO COMPILATION SANDBOX ---
  deerflow-sandbox-go:
    image: golang:1.22-alpine
    container_name: deerflow_sandbox_go
    working_dir: /workspace
    volumes:
      - ./logs/deerflow:/workspace/output
    environment:
      - SANDBOX_MODE=true
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    networks:
      - camelot_net
    profiles:
      - sarda
    command: ["tail", "-f", "/dev/null"]

  # --- SOVEREIGN STREAMING HUB (Omega_KINETIC_NEXUS) ---
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin_media
    environment:
      - JELLYFIN_PublishedServerUrl=http://cybertronia.tailcd0c29.ts.net:8096
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${MEDIA_DIR:-C:/Users/vizio/Videos}:/media:ro
    ports:
      - "8096:8096"    # Web UI
      - "8920:8920"    # HTTPS (optional)
    devices:
      - /dev/dri:/dev/dri  # GPU passthrough for hardware transcoding (Linux)
    mem_limit: 3g
    restart: unless-stopped
    networks:
      - camelot_net
    profiles:
      - streaming  # Run with 'docker compose --profile streaming up'

  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - jellyfin
    restart: unless-stopped
    networks:
      - camelot_net
    profiles:
      - streaming

volumes:
  jellyfin_config:
  jellyfin_cache:
  caddy_data:
  caddy_config:

networks:
  camelot_net:
    driver: bridge
