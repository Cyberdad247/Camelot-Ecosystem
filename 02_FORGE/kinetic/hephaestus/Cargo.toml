[package]
name = "hephaestus"
version = "1.0.0"
edition = "2021"
description = "Cartridge_Hephaestus — Deterministic Engineering Runtime for Camelot-OS"
authors = ["VaShawn O. Head <vizion711@gmail.com>"]

[[bin]]
name = "hephaestus"
path = "src/main.rs"

[lib]
name = "hephaestus"
path = "src/lib.rs"

[dependencies]
wasmtime   = "14.0"
tree-sitter = "0.20"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
hex        = "0.4"
chrono     = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
