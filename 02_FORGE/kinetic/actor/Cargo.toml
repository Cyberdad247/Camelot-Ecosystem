[package]
name = "actor"
version = "0.1.0"
edition = "2021"
description = "Camelot-OS WASM actor host — Wasmtime 30.x runtime boundary for wasm32-wasip1/wasm32-wasip2 guest components. Iron-Gate scope PR member."
license = "Invisioned Marketing inc. — All Rights Reserved"
publish = false

[lib]
name = "actor"
path = "src/lib.rs"
# Default rlib — this crate is a HOST runtime wrapper, NOT a guest WASM component.
# Do NOT add `crate-type = ["cdylib"]`; that would imply the crate compiles to a
# standalone WASM payload, which contradicts its host role and pollutes Cargo.lock.

[dependencies]
# Pinned to wasmtime 30.x — verify on https://crates.io/crates/wasmtime before merge.
# wasmtime and wasmtime-wasi are version-locked (single repo, twin publishes).
wasmtime   = { version = "30", default-features = false, features = ["runtime", "component-model", "async"] }
# wasmtime-wasi is kept as a dep for downstream guests; default-features=true ensures
# the wasm32-wasip2 / p2 capability-handle registration API surface remains available
# for follow-up PRs that wire the first guest actor. This stub does NOT call it yet.
wasmtime-wasi = "30"
# Pre-existing dep baseline to match the rest of the workspace.
anyhow = "1.0"
thiserror = "1"

[dev-dependencies]
# Reserved for future self-tests; current self-test is the in-source `#[test]` block.
