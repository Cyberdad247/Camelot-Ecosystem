<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Excalibur Command Center | Camelot-OS</title>
    <meta name="description" content="Digital Throne Room with node registry, telemetry, and Alfred voice interface." />
    
    <!-- PWA Shell -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050510" />
    
    <!-- Mr. Wealth Typography Stack -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <meta property="og:title" content="Excalibur Command Center" />
    <meta property="og:description" content="Digital Throne Room with node registry, telemetry, and Alfred voice interface." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#050508] text-slate-100 font-sans antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // In dev preview, clear any service worker registrations to prevent caching issues
        if (location.hostname.includes('run.app') || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (const r of regs) r.unregister();
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
          });
        }
      }
    </script>
  </body>
</html>
