syntax = "proto3";

package camelot.audio.v1;

option go_package = "camelot/audio/v1;audiov1";

message AudioChunk {
  bytes pcm_data = 1;
  int32 sample_rate = 2;
  int32 channels = 3;
  string codec = 4; // "opus", "pcm16"
  int64 timestamp_ns = 5;
  bool is_speech = 6;
  float energy_rms = 7;
}

message VoiceAuthVector {
  string speaker_id = 1;
  repeated float embedding = 2; // 256-dim ONNX speaker embedding
  string hash_sha3_256 = 3;
  int64 verified_at_utc = 4;
  float confidence = 5;
}
