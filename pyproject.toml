[project]
name = "camelot-os"
version = "400.1.0"
description = "Camelot Apex OS v400.1.0 — Lattice Radiant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "psutil",
    "playwright",
    "numpy",
    "colorama",
    "pytest",
    "redis",
    "faiss-cpu",
    "httpx",
    "modal",
    "google-generativeai",
    "appwrite",
    "replicate",
    "pydantic",
    "scrapling[ai]>=0.4.3",
    "supabase>=2.28.3",
    "python-dotenv>=1.2.2",
    "gradio",
    "textual",
    "reportlab",
    "pyyaml",
    "browser-use>=0.1",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
]

[project.scripts]
camelot = "control_plane.camelot_cli:main"
"Camelot-OS" = "control_plane.camelot_cli:main"
awaken = "bin.awaken:main"

[tool.setuptools.packages.find]
include = ["control_plane*", "bin*"]

[tool.codeflash]
module-root = "."
tests-root = "tests"
formatter-cmds = ["disabled"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "node_modules",
    "venv",
    "99_ARCHIVE",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", "99_ARCHIVE"]
venvPath = "."
venv = ".venv"

[tool.black]
line-length = 120
target-version = ['py313']
