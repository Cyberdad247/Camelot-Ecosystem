[project]
name = "camelot-os"
version = "300.4.0"
description = "Camelot Apex OS v300.0 — Universal Singularity"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "psutil",
    "playwright",
    "numpy",
    "colorama",
    "pytest",
    "redis",
    "faiss-cpu",
    "httpx",
    "modal",
    "google-generativeai",
    "appwrite",
    "replicate",
    "pydantic",
    "scrapling[ai]>=0.4.3",
    "supabase>=2.28.3",
    "python-dotenv>=1.2.2",
    "gradio",
]

[project.scripts]
camelot = "control_plane.camelot_cli:main"
"Camelot-OS" = "control_plane.camelot_cli:main"

[tool.codeflash]
module-root = "."
tests-root = "tests"
formatter-cmds = ["disabled"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py313']
