[project]
name = "camelot-os"
version = "1000.0.0"
description = "Camelot Apex OS v1000.0.0 — [V1000.0_ASCENDED] Cosmic Ecosystem"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # ── Web / API ──────────────────────────────────────────────────────────
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "httpx>=0.25.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",

    # ── LLM / AI ───────────────────────────────────────────────────────────
    "openai>=1.0.0",
    "google-generativeai",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=1.2.0",
    "litellm>=1.75.5",
    "browser-use>=0.1",

    # ── MCP / Agent tooling ────────────────────────────────────────────────
    "mcp>=1.26.0",
    "typer",
    "tenacity",
    "jinja2",

    # ── Memory / Graph ─────────────────────────────────────────────────────
    "faiss-cpu>=1.7.4",
    "networkx>=3.0",
    "numpy>=1.24.0",

    # ── Data / Config ──────────────────────────────────────────────────────
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "redis",
    "supabase>=2.28.3",

    # ── Cloud / Infra ──────────────────────────────────────────────────────
    "modal",
    "appwrite>=2.0.0,<3.0.0",
    "replicate",
    "cryptography>=41.0",
    "PyJWT[crypto]",

    # ── Scraping / Web ─────────────────────────────────────────────────────
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.0.0",
    "html2text>=2020.1.16",
    "crawl4ai>=0.8.0",

    # ── CLI / TUI ──────────────────────────────────────────────────────────
    "rich>=13.0",
    "colorama",
    "textual",
    "prompt_toolkit",
    "platformdirs",

    # ── Utilities ──────────────────────────────────────────────────────────
    "psutil>=5.9.0",
    "prometheus-client>=0.19.0",
    "reportlab",
    "croniter",
    "gradio",
    "pytest",
    "pytest-rerunfailures>=15.0",
]

[project.optional-dependencies]

# Heavy ML / voice stack — install with: pip install -e ".[voice]"
voice = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers",
    "sentence-transformers>=2.2.0",
    "huggingface_hub",
    "soundfile",
    "g2p-en",
    "nltk",
    "numba",
    "edge-tts",
]

# Bot/gateway integrations — install with: pip install -e ".[gateway]"
gateway = [
    "python-telegram-bot>=20.0",
    "discord.py>=2.0",
    "firecrawl-py",
    "fal-client",
    "parallel-web>=0.4.2",
]

# Web search / stealth scraping extras
web = [
    "playwright-stealth>=1.0.0",
    "fire",
    "scrapling==0.4.7",
]

# All optional groups — install with: pip install -e ".[all]"
all = [
    "camelot-os[voice]",
    "camelot-os[gateway]",
    "camelot-os[web]",
]

[project.scripts]
camelot        = "control_plane.camelot_cli:main"
ai             = "bin.camelot:main"
"Camelot-OS"   = "control_plane.camelot_cli:main"
awaken         = "bin.awaken:main"
knight-session = "bin.knight_session:main"
ks             = "bin.knight_session:main"

[tool.setuptools.packages.find]
include = ["control_plane*", "bin*"]

[tool.codeflash]
module-root = "."
tests-root  = "tests"
formatter-cmds = ["disabled"]

[tool.ruff]
line-length    = 120
target-version = "py313"
exclude = [
    ".git", ".ruff_cache", ".venv", "__pypackages__",
    "build", "dist", "node_modules", "venv", "99_ARCHIVE",
]

[tool.ruff.lint]
select  = ["E", "F", "B", "I"]
ignore  = ["E501"]
fixable = ["ALL"]

[tool.pyright]
include   = ["."]
exclude   = ["**/node_modules", "**/__pycache__", "99_ARCHIVE"]
venvPath  = "."
venv      = ".venv"

[tool.black]
line-length    = 120
target-version = ["py313"]

[tool.pytest.ini_options]
cache_dir = "data/.pytest_cache"
addopts   = "--basetemp=data/.pytest_temp --import-mode=importlib --override-ini=tmp_path_retention_policy=none --reruns 2 --reruns-delay 3"
# Canonical CAMELOT test suites only. Without these, pytest sweeps 464 test_*.py
# across vendored references, git worktrees, and build output, producing 65
# collection errors from basename collisions and missing 3rd-party deps.
# 01_KERNEL is intentionally excluded: it carries a vendored MCP servers repo
# plus co-located tests with uninstalled optional deps (freezegun, soundfile,
# GitPython) and CWD-fragile imports. Run those explicitly once remediated.
testpaths = ["tests", "03_VAULT/training/configs/tests"]
norecursedirs = [
    ".worktrees", ".venv", "node_modules", "build", "dist", "logs", "data",
    "99_ARCHIVE", "99_HISTORY", "02_FORGE",
    "03_VAULT/KINETIC_REFERENCES", "03_VAULT/LLM-Apps-Ref",
    "01_KERNEL/system/omniroute_sandbox",
]

[tool.uv.workspace]
members = [
    "01_KERNEL/senses/omni_eye_agent",
]
