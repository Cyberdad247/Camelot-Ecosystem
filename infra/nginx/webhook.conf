# Camelot-OS hub — webhook ingress route (R3 nginx parity, HITL 2026-09-23)
#
# Purpose: replicate the repo-canonical Caddyfile route
#   handle /webhook/* { reverse_proxy 127.0.0.1:9000 }
# on the hub's actual ingress (nginx owns :80 today; see
# docs/HITL_VPS_REMEDIATION_PLAN.md R3 for the decision record).
#
# Install (requires explicit operator approval — HITL):
#   1. scp infra/nginx/webhook.conf root@162.35.107.134:/etc/nginx/snippets/camelot-webhook.conf
#   2. On the hub, include it inside the :80 server block:
#        include snippets/camelot-webhook.conf;
#   3. nginx -t && systemctl reload nginx
#   4. Deploy the webhook receiver unit FIRST (it must listen on 127.0.0.1:9000
#      before this route goes live, or /webhook/* answers 502 in the gap).
#
# Verification: scripts/vps_hub_bootstrap.sh --self-check asserts this route is
# ACTIVE in `nginx -T` once the snippet file exists (camelot-webhook.conf parity check).

location /webhook/ {
    proxy_pass         http://127.0.0.1:9000;
    proxy_http_version 1.1;
    # GitHub webhook contract: raw body + signature headers must reach the receiver
    # unmodified (vps_github_webhook verifies HMAC before anything else).
    proxy_set_header   Host              $host;
    proxy_set_header   X-GitHub-Event    $http_x_github_event;
    proxy_set_header   X-GitHub-Delivery $http_x_github_delivery;
    proxy_set_header   X-Hub-Signature-256 $http_x_hub_signature_256;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
}
