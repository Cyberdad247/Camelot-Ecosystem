#
# Camelot-OS mesh bridge (127.0.0.1:8095) through the hub's nginx ingress.
#
# Included from inside the `server { }` block of the hub's site config. It is a snippet
# rather than a site of its own because the hub already has exactly one server block for
# :80 (`listen 80 default_server; server_name _;`) and a second catch-all block would be
# shadowed. The include must sit inside the server block, not in /etc/nginx/conf.d/ —
# conf.d is included in the `http` context, where `location` is invalid.
#
# WHY THESE FOUR PATHS
#
# `scripts/deploy_luxora_nexus_lab.sh` declares the client contract in NEXT_PUBLIC_* and
# then verifies the same paths with its own `check_endpoint` calls:
#
#     NEXT_PUBLIC_MESH_STATUS=/mesh/status            check_endpoint "Mesh Bridge Telemetry"
#     NEXT_PUBLIC_BIFROST_KNIGHTS=/bifrost/knights    check_endpoint "Bifrost Knights Registry"
#     NEXT_PUBLIC_HERMES_TELEMETRY=/hermes/telemetry  check_endpoint "Hermes Research Telemetry"
#     NEXT_PUBLIC_HEIMDALL_GOVERNANCE=/heimdall/...   check_endpoint "Heimdall Zero-Trust Governance"
#
# All four are served by the bridge. Before this snippet two of them were answered by the
# hub's `location /` catch-all (the Hermes dashboard, `302 /login`) and one was swallowed
# by the Bifrost gateway's prefix match (`404`) — so a deploy script asserting its own
# contract would have failed on it. These paths are that contract, not a guess at it.
#
# The bridge serves eighteen paths in total; the rest are reached directly on the tailnet
# address by their consumers (`control_plane/cli/knight_hud.py` probes :8095 directly).
# Routing paths with no declared consumer would widen the surface for no benefit.
#
# WHY `location =` AND NOT A PREFIX
#
# `location /bifrost/` belongs to the Bifrost *gateway* on :3001 and strips the prefix. A
# prefix route here would have to out-rank it, risking the WebSocket and gateway traffic
# that shares that path. Exact-match locations are consulted before any prefix match, so
# these entries cannot shadow `/ws`, `/bifrost/`, `/v1/`, `/api/v1/` or `/`.
#
# ACCESS CONTROL — WHY IT IS INSIDE EACH location AND NOT AT THE TOP OF THIS FILE
#
# `allow`/`deny` are inherited by nested contexts, so an access rule written at the top
# level of this snippet would be a rule for the whole `server` block — it would gate the
# Hermes dashboard, the OpenAI-compatible gateway and everything else on :80, not just
# these four routes. Each location therefore carries its own rules, and the only thing
# this file does at the top level is declare locations.
#
# These responses carry internal infrastructure detail: `/mesh/status` returns the mesh
# inventory (node hostnames, their Tailscale addresses, the tailnet account name) and
# reports `"auth_mode": "unconfigured"` because `MESH_BRIDGE_TOKEN` is unset; the other
# three return agent telemetry and governance state. None of them authenticates a caller.
# So the four routes are reachable from the hub itself and the tailnet, which is where
# every check in this repository runs. The client contract sets `NEXT_PUBLIC_TAILSCALE_IP`,
# so a tailnet origin is the intended one anyway.
#
# To serve them publicly, delete the four access directives from each location below. Do
# it deliberately: it publishes the mesh inventory and agent telemetry to anyone, and the
# first crawler to index :80 keeps a copy. Note the coupling too — if `MESH_BRIDGE_TOKEN`
# is ever provisioned, the bridge starts 401ing these routes, because neither nginx nor a
# browser client sends that header. Exposing a route and enforcing a token are mutually
# exclusive until the client authenticates.

location = /mesh/status {
    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;   # the Tailscale CGNAT range the mesh inventory itself uses
    deny  all;

    proxy_pass         http://100.110.180.18:8095;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location = /bifrost/knights {
    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;
    deny  all;

    proxy_pass         http://100.110.180.18:8095;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location = /hermes/telemetry {
    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;
    deny  all;

    proxy_pass         http://100.110.180.18:8095;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location = /heimdall/governance {
    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;
    deny  all;

    proxy_pass         http://100.110.180.18:8095;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
