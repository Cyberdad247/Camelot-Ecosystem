version: "3.8"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Secret Photo Viewer (primary replica) ───────────────────────
  secret-photo-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: secret-photo-viewer:latest
    container_name: secret-photo-viewer
    ports:
      - "7860:7860"
    environment:
      - SPV_HOST=0.0.0.0
      - SPV_PORT=7860
      - SPV_MAX_UPLOAD_SIZE=${SPV_MAX_UPLOAD_SIZE:-10485760}
      - SPV_LOG_LEVEL=${SPV_LOG_LEVEL:-INFO}
      - SPV_STAGING_MAX_AGE_SECONDS=${SPV_STAGING_MAX_AGE_SECONDS:-3600}
      - SPV_RATE_LIMIT_REQUESTS=${SPV_RATE_LIMIT_REQUESTS:-20}
      - SPV_RATE_LIMIT_WINDOW_SECONDS=${SPV_RATE_LIMIT_WINDOW_SECONDS:-60}
      - SPV_API_KEY=${SPV_API_KEY}
      - SPV_PASSWORD_HASH=${SPV_PASSWORD_HASH}
      - SPV_GOOGLE_CLIENT_ID=${SPV_GOOGLE_CLIENT_ID}
      # Multi-replica backend configuration (enabled by default with bundled services)
      - SPV_STORAGE_BACKEND=s3
      - SPV_REDIS_URL=redis://redis:6379/0
      - SPV_S3_ENDPOINT=http://minio:9000
      - SPV_S3_BUCKET=spv-staging
      - SPV_S3_ACCESS_KEY=${SPV_S3_ACCESS_KEY:-minioadmin}
      - SPV_S3_SECRET_KEY=${SPV_S3_SECRET_KEY:-minioadmin}
    volumes:
      - spv-staging:/app/staged_uploads
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health').close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  # ── Secret Photo Viewer (secondary replica) ─────────────────────
  secret-photo-viewer-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: secret-photo-viewer:latest
    container_name: secret-photo-viewer-2
    ports:
      - "7861:7860"
    environment:
      - SPV_HOST=0.0.0.0
      - SPV_PORT=7860
      - SPV_MAX_UPLOAD_SIZE=${SPV_MAX_UPLOAD_SIZE:-10485760}
      - SPV_LOG_LEVEL=${SPV_LOG_LEVEL:-INFO}
      - SPV_STAGING_MAX_AGE_SECONDS=${SPV_STAGING_MAX_AGE_SECONDS:-3600}
      - SPV_RATE_LIMIT_REQUESTS=${SPV_RATE_LIMIT_REQUESTS:-20}
      - SPV_RATE_LIMIT_WINDOW_SECONDS=${SPV_RATE_LIMIT_WINDOW_SECONDS:-60}
      - SPV_API_KEY=${SPV_API_KEY}
      - SPV_PASSWORD_HASH=${SPV_PASSWORD_HASH}
      - SPV_GOOGLE_CLIENT_ID=${SPV_GOOGLE_CLIENT_ID}
      # Multi-replica backend configuration (enabled by default with bundled services)
      - SPV_STORAGE_BACKEND=s3
      - SPV_REDIS_URL=redis://redis:6379/0
      - SPV_S3_ENDPOINT=http://minio:9000
      - SPV_S3_BUCKET=spv-staging
      - SPV_S3_ACCESS_KEY=${SPV_S3_ACCESS_KEY:-minioadmin}
      - SPV_S3_SECRET_KEY=${SPV_S3_SECRET_KEY:-minioadmin}
    volumes: []  # No local volume needed — S3-backed storage is shared across replicas
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health').close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    profiles:
      - multi-replica  # Only started with: docker compose --profile multi-replica up -d

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: secret-photo-viewer-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - secret-photo-viewer
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"

  grafana:
    image: grafana/grafana:10.4.1
    container_name: secret-photo-viewer-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  redis:
    image: redis:7-alpine
    container_name: secret-photo-viewer-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-10T02-53-48Z
    container_name: secret-photo-viewer-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-03-10T02-53-48Z
    container_name: secret-photo-viewer-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      set -e;
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/spv-staging --ignore-existing;
      mc ilm add --expiry-days 1 myminio/spv-staging;
      "

volumes:
  spv-staging:
  grafana-data:
  minio-data:
