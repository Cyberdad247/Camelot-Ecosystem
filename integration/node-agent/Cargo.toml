[package]
name = "camelot-node-agent"
version = "0.1.0"
edition = "2021"
description = "Camelot local compute node: leased audio-feature jobs, CPU baseline, optional Vulkan probe backend. Part of the Kickbox voice vertical slice (ADR-001)."

[features]
default = []
# Optional Vulkan acceleration. Probe-based scaffold: enabling the feature
# never breaks startup — if no Vulkan loader is present the agent falls back
# to the CPU backend (bootstrap-plan T5).
vulkan = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
# SIGINT/SIGTERM handlers for graceful shutdown (no async runtime needed).
libc = "0.2"

# No `[lints] workspace = true` here: the crate must also build standalone
# inside the Docker image (compose copies only this directory, not the
# repository workspace root).
