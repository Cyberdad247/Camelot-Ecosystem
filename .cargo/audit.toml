# cargo-audit configuration
#
# The advisory list is EMPTY, and `cargo audit` passes with zero vulnerabilities.
# Keep it that way.
#
# History: on 2026-08-11 the first-ever run of cargo audit in this repo found 24
# advisories — 21 in wasmtime/wasmtime-wasi 30.0.2 (the WASM sandbox itself,
# five of them sandbox-escape class) and 2 in pyo3 0.23. They were fixed by
# upgrading wasmtime 30 -> 47 and pyo3 0.23 -> 0.29, not by ignoring them.
#
# POLICY: do not add entries to `ignore` to turn a red build green. An advisory
# in this repo's dependency tree is usually a hole in a security boundary
# (wasmtime *is* the SOULS isolation layer), not a peripheral CVE. Upgrade the
# dependency. If an advisory genuinely cannot be fixed, the entry must carry the
# reason, the owner, and the date it will be revisited.

[advisories]
ignore = []

# `unmaintained` is informational: it flags crates without a maintainer rather
# than a known exploit. Currently 1 (rustls-pemfile, transitive via reqwest);
# it clears when reqwest is upgraded.
informational_warnings = ["unmaintained"]
