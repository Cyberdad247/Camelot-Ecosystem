<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bifrost Tower — Camelot-OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --obsidian:#050505;
    --plate:#0B0B10;
    --plate-edge:#16161e;
    --gold:#D4AF37;
    --gold-dim:rgba(212,175,55,.32);
    --gold-faint:rgba(212,175,55,.10);
    --purple:#2E0854;
    --purple-neon:#7A3BD6;
    --purple-glow:rgba(122,59,214,.55);
    --ink:#E8E2D0;
    --ink-dim:#8d8878;
    --floor-h:150px;
    --floor-gap:190px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--obsidian);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    overflow-x:hidden;
  }

  /* Scroll track: one viewport per floor. The stage is fixed; scroll drives the tower. */
  #track{height:calc(8 * 100vh + 60vh)}

  #stage{
    position:fixed;inset:0;
    perspective:1100px;
    perspective-origin:50% 42%;
    overflow:hidden;
  }

  /* Ambient depth grid */
  #stage::before{
    content:"";position:absolute;inset:-40%;
    background:
      radial-gradient(ellipse 60% 45% at 50% 40%, rgba(46,8,84,.28), transparent 65%),
      repeating-linear-gradient(0deg, transparent 0 79px, rgba(212,175,55,.045) 79px 80px),
      repeating-linear-gradient(90deg, transparent 0 79px, rgba(212,175,55,.045) 79px 80px);
    transform:rotateX(62deg) translateY(18%);
    transform-origin:50% 60%;
    pointer-events:none;
  }

  /* ── The tower ─────────────────────────────────────── */
  #tower{
    position:absolute;left:50%;top:44%;
    transform-style:preserve-3d;
    will-change:transform;
  }

  .floor{
    position:absolute;left:0;top:0;
    width:min(560px,78vw);height:var(--floor-h);
    margin-left:calc(min(560px,78vw) / -2);
    margin-top:calc(var(--floor-h) / -2);
    transform-style:preserve-3d;
    background:linear-gradient(180deg,var(--plate) 0%,#08080c 100%);
    border:1px solid var(--gold-dim);
    border-radius:6px;
    padding:22px 26px 20px 92px;
    box-shadow:0 30px 60px rgba(0,0,0,.75), inset 0 1px 0 var(--gold-faint);
    transition:border-color .4s, box-shadow .4s, opacity .4s;
    opacity:.55;
  }
  .floor.active{
    opacity:1;
    border-color:var(--purple-neon);
    box-shadow:
      0 0 0 1px var(--purple),
      0 0 34px var(--purple-glow),
      0 30px 60px rgba(0,0,0,.8),
      inset 0 1px 0 var(--gold-faint);
  }
  .floor.active .numeral{color:var(--gold);border-color:var(--gold)}

  .numeral{
    position:absolute;left:22px;top:50%;
    transform:translateY(-50%);
    width:52px;height:52px;
    display:grid;place-items:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:19px;
    color:var(--ink-dim);
    border:1px solid var(--gold-dim);
    border-radius:50%;
    transition:color .4s,border-color .4s;
  }
  .floor h2{
    font-family:'Cinzel',serif;font-weight:600;
    font-size:clamp(17px,2.2vw,22px);
    letter-spacing:.14em;color:var(--ink);
    margin-bottom:6px;
  }
  .floor .role{font-size:12.5px;color:var(--ink-dim);line-height:1.5;margin-bottom:8px}
  .floor .data{
    font-size:11px;letter-spacing:.04em;color:var(--gold);
    opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* The provenance spine — one gold thread through every floor */
  .spine{
    position:absolute;left:50%;width:2px;
    margin-left:-1px;
    background:linear-gradient(180deg,var(--gold) 0%,var(--gold-dim) 100%);
    box-shadow:0 0 12px rgba(212,175,55,.5);
    transform:translateZ(-40px);
  }

  /* ── Fixed chrome ─────────────────────────────────── */
  header{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;justify-content:space-between;align-items:baseline;
    padding:26px clamp(20px,4vw,54px);
    pointer-events:none;
  }
  header .mark{
    font-family:'Cinzel',serif;font-weight:700;font-size:15px;
    letter-spacing:.32em;color:var(--gold);
  }
  header .realm{font-size:10.5px;letter-spacing:.2em;color:var(--ink-dim)}

  /* Elevator index — right rail, one rune per floor */
  nav{
    position:fixed;right:clamp(14px,3vw,44px);top:50%;z-index:10;
    transform:translateY(-50%);
    display:flex;flex-direction:column;gap:14px;
  }
  nav button{
    width:30px;height:30px;
    background:none;border:1px solid var(--gold-dim);border-radius:50%;
    color:var(--ink-dim);
    font-family:'Cinzel',serif;font-size:10px;font-weight:700;
    cursor:pointer;transition:all .3s;
  }
  nav button.active{
    border-color:var(--purple-neon);color:var(--gold);
    box-shadow:0 0 14px var(--purple-glow);
  }
  nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* Descent readout — bottom left */
  #readout{
    position:fixed;left:clamp(20px,4vw,54px);bottom:30px;z-index:10;
    font-size:10.5px;letter-spacing:.18em;color:var(--ink-dim);
  }
  #readout b{color:var(--gold);font-weight:500}

  #hint{
    position:fixed;left:50%;bottom:30px;z-index:10;
    transform:translateX(-50%);
    font-size:10px;letter-spacing:.3em;color:var(--ink-dim);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}

  /* Reduced motion: flatten the tower into a stacked scroll list */
  @media (prefers-reduced-motion: reduce){
    #track{height:auto}
    #stage{position:static;perspective:none;padding:120px 0 80px}
    #stage::before{display:none}
    #tower{position:static;transform:none !important}
    .floor{position:relative;margin:0 auto 26px;left:auto;top:auto;opacity:1}
    .spine,#hint{display:none}
    nav{display:none}
  }
  @media (max-width:640px){
    .floor{padding-left:78px}
    .numeral{left:14px;width:44px;height:44px;font-size:16px}
    nav{gap:10px}
    nav button{width:24px;height:24px;font-size:8px}
  }
</style>
</head>
<body>

<header>
  <span class="mark">BIFROST TOWER</span>
  <span class="realm">CAMELOT-OS · CYBERTRONIA REALM</span>
</header>

<nav id="elevator" aria-label="Floor index"></nav>

<div id="readout">DESCENT <b id="pct">0%</b> · FLOOR <b id="cur">VII</b></div>
<div id="hint">SCROLL TO DESCEND</div>

<div id="track"></div>

<div id="stage" aria-hidden="false">
  <div id="tower"></div>
</div>

<script>
const FLOORS = [
  { n:'VII', name:'ENVELOPE SEAL',     role:'Every intent enters the tower wrapped in a canonical header — signed, checksummed, nonce-fresh.', data:'hmac-sha256 · 24 fields · ver-mismatch fails closed' },
  { n:'VI',  name:'BOUNDED PASSAGE',   role:'Priority queues partitioned by session. Critical writs may bypass — only under a valid seal.', data:'critical > high > normal > low · shed → dead-letter' },
  { n:'V',   name:'THE GATEWAY',       role:'Three verdicts fuse into one: envelope truth, node health, sovereign policy.', data:'quarantine > block > review > warn > allow' },
  { n:'IV',  name:'REGISTRATION GATE', role:'No unproven node consumes scoring. Identity, sidecar, and preflight stand before the oracle is asked.', data:'invalid nodes never score · x-realm reconciled' },
  { n:'III', name:'HEIMDALL WATCH',    role:'Seven states of containment. Ragnarok isolates absolutely — recovery traffic alone may pass.', data:'healthy → observed → suspect → quarantine → ragnarok' },
  { n:'II',  name:'MICROFISH ORACLE',  role:'The tower watches its own pulse. Anomalies climb the sigma ladder and summon the Watch.', data:'2.5σ minor · 4σ major · 6σ critical → containment' },
  { n:'I',   name:'FFI TRIBUNAL',      role:'Failure is judged conservatively. Timeouts earn review; broken contracts earn silence.', data:'timeout → 1 retry → review · compute-fail → no retry' },
  { n:'Ω',   name:'YGGDRASIL LEDGER',  role:'The foundation. Every event chained to the last, rooted in one Merkle truth. Nothing reorders. Nothing is unwritten.', data:'prev_hash chain · merkle root · quarantine appends first' }
];

const tower = document.getElementById('tower');
const nav = document.getElementById('elevator');
const GAP = 190;

FLOORS.forEach((f, i) => {
  const el = document.createElement('section');
  el.className = 'floor';
  el.style.transform = `translateY(${i * GAP}px) translateZ(0px)`;
  el.innerHTML = `<span class="numeral">${f.n}</span><h2>${f.name}</h2><p class="role">${f.role}</p><p class="data">${f.data}</p>`;
  tower.appendChild(el);

  const b = document.createElement('button');
  b.textContent = f.n;
  b.setAttribute('aria-label', `Floor ${f.n}: ${f.name}`);
  b.addEventListener('click', () => {
    window.scrollTo({ top: i * window.innerHeight, behavior: 'smooth' });
  });
  nav.appendChild(b);
});

/* The gold provenance spine spans the full tower height */
const spine = document.createElement('div');
spine.className = 'spine';
spine.style.top = `-${GAP * .5}px`;
spine.style.height = `${GAP * (FLOORS.length - 1) + GAP}px`;
tower.appendChild(spine);

const floorEls = [...tower.querySelectorAll('.floor')];
const navEls = [...nav.querySelectorAll('button')];
const pct = document.getElementById('pct');
const cur = document.getElementById('cur');
const hint = document.getElementById('hint');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function render(){
  if (reduced) return;
  const max = document.body.scrollHeight - window.innerHeight;
  const p = max > 0 ? Math.min(1, window.scrollY / max) : 0;
  const idx = Math.min(FLOORS.length - 1, Math.round(p * (FLOORS.length - 1)));

  tower.style.transform =
    `translate(-50%,-50%) rotateX(9deg) translateY(${ -p * GAP * (FLOORS.length - 1) }px)`;

  floorEls.forEach((el, i) => {
    const d = i - p * (FLOORS.length - 1);
    el.style.transform =
      `translateY(${i * GAP}px) translateZ(${ -Math.abs(d) * 46 }px) rotateX(${ d * -2.2 }deg)`;
    el.classList.toggle('active', i === idx);
  });
  navEls.forEach((b, i) => b.classList.toggle('active', i === idx));

  pct.textContent = Math.round(p * 100) + '%';
  cur.textContent = FLOORS[idx].n;
  hint.style.display = p > 0.03 ? 'none' : '';
}

let ticking = false;
addEventListener('scroll', () => {
  if (!ticking){ requestAnimationFrame(() => { render(); ticking = false; }); ticking = true; }
}, { passive:true });
addEventListener('resize', render);

/* Arrow keys ride the elevator floor by floor */
addEventListener('keydown', e => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const max = document.body.scrollHeight - window.innerHeight;
  const p = max > 0 ? window.scrollY / max : 0;
  const idx = Math.round(p * (FLOORS.length - 1));
  const next = Math.max(0, Math.min(FLOORS.length - 1, idx + (e.key === 'ArrowDown' ? 1 : -1)));
  e.preventDefault();
  window.scrollTo({ top: next * window.innerHeight, behavior:'smooth' });
});

render();
</script>
</body>
</html>
