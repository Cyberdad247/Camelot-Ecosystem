# Camelot-OS Policy Engine Schema // Human-In-The-Loop (HITL) State Machine
# Cartridge Context: KBA Executive Ecosystem (Tenant 001)
# Version: 1.0.0-EXCALIBUR

$schema: "https://json-schema.org/draft/2020-12/schema"
title: KBATenant001ApprovalStateMachine
tenant_id: "KBA-TENANT-001"
security_level: "ZERO_TRUST_HITL_IRON_GATE"

states:
  IDLE:
    description: "Initial state before actionable kinetic intent is generated."
    allowed_transitions:
      - AWAITING_APPROVAL
    metadata:
      auto_advance: false

  AWAITING_APPROVAL:
    description: "Kinetic proposal awaiting Sovereign Executive or Audit Knight sign-off."
    timeout_seconds: 1800 # 30 minutes before auto-escalation
    on_timeout: "ESCALATE_TO_SOVEREIGN"
    required_roles:
      - "Sovereign_Executive"
      - "Audit_Knight"
    allowed_transitions:
      - EDITING_BY_HUMAN
      - EXECUTING
      - REJECTED
      - SUSPENDED
    validation_guards:
      - name: "RiskScoreCheck"
        condition: "intent.risk_entropy < 75"
        failure_action: "REQUIRE_MULTI_SIG"
      - name: "MemoryCeilingCheck"
        condition: "node.ram_usage_mb < 7168" # Enforce strict 8GB local ceiling (7GB buffer)

  EDITING_BY_HUMAN:
    description: "Human operator has locked the intent diff and is actively modifying parameters."
    lock_owner_required: true
    lock_timeout_seconds: 600
    allowed_transitions:
      - AWAITING_APPROVAL
      - EXECUTING
      - CANCELLED
    validation_guards:
      - name: "ASTSyntaxValidator"
        rule: "validate_patch_syntax(proposed_diff)"
      - name: "NoSecretExposure"
        condition: "contains_no_raw_secrets(proposed_diff)"

  EXECUTING:
    description: "Kinetic execution dispatched to bare-metal edge via Bifrost Mesh."
    execution_timeout_seconds: 300
    allowed_transitions:
      - COMPLETED
      - FAILED
      - ROLLBACK_IN_PROGRESS
    hooks:
      on_enter: "dispatch_bifrost_payload"
      on_exit: "verify_execution_artifacts"

  ROLLBACK_IN_PROGRESS:
    description: "Execution failure or anomaly detected. Reverting to last known stable checkpoint."
    allowed_transitions:
      - ROLLED_BACK
      - CRITICAL_HALT
    hooks:
      on_enter: "execute_crdt_compensation_log"

  COMPLETED:
    description: "Terminal success state. Audit log finalized and written to immutable ledger."
    is_terminal: true

  REJECTED:
    description: "Proposal explicitly rejected by HITL gate."
    is_terminal: true

  CANCELLED:
    description: "Human edit cancelled during mutation."
    is_terminal: true

  SUSPENDED:
    description: "High-entropy risk detected; process suspended pending emergency override."
    requires_override_token: "CAMELOT_DASHBOARD_OPERATOR_TOKEN"
    allowed_transitions:
      - AWAITING_APPROVAL
      - REJECTED

  CRITICAL_HALT:
    description: "System panic mode. Bare-metal edge isolated from external network calls."
    is_terminal: true

transitions_matrix:
  - from: "AWAITING_APPROVAL"
    to: "EDITING_BY_HUMAN"
    trigger: "HUMAN_ACQUIRE_LOCK"
    rbac: ["Sovereign_Executive", "Audit_Knight"]

  - from: "EDITING_BY_HUMAN"
    to: "AWAITING_APPROVAL"
    trigger: "HUMAN_SAVE_DRAFT"
    rbac: ["Sovereign_Executive", "Audit_Knight"]

  - from: "EDITING_BY_HUMAN"
    to: "EXECUTING"
    trigger: "HUMAN_APPROVE_AND_EXECUTE"
    rbac: ["Sovereign_Executive"]
    requires_2fa: true

  - from: "AWAITING_APPROVAL"
    to: "EXECUTING"
    trigger: "DIRECT_SOVEREIGN_APPROVE"
    rbac: ["Sovereign_Executive"]
    guard: "RiskScoreCheck"

  - from: "EXECUTING"
    to: "COMPLETED"
    trigger: "BIFROST_EXECUTION_ACK"

  - from: "EXECUTING"
    to: "ROLLBACK_IN_PROGRESS"
    trigger: "EXECUTION_FAILURE_OR_TIMEOUT"

audit_logging:
  destination: "03_VAULT/runtime_state/hitl_audit_ledger.jsonl"
  include_fields:
    - "tenant_id"
    - "transaction_id"
    - "from_state"
    - "to_state"
    - "operator_id"
    - "timestamp"
    - "signature"
