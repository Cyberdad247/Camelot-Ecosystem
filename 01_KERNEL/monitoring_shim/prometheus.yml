# Camelot Apex OS — Prometheus scrape config (native binary, NO DOCKER).
#
# Launch via: monitoring/start_observability.ps1
# Binaries live under: 02_FORGE/kinetic/bin/prometheus/ and .../grafana/
# Titanium Law I: Go binaries over Python where available.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    host: camelot-kinetic-edge
    tier: tier1-local-brain

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: local_brain_excalibur
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8001"]
        labels:
          service: excalibur
          tier: local_brain

  - job_name: morgana_cloud_bridge
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9091"]
        labels:
          service: morgana_core
          tier: cloud_orchestrator_bridge

  - job_name: cli_proxy_api
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8080"]
        labels:
          service: cliproxy
          tier: local_brain
