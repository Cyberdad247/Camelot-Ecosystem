[package]
name = "camelot-pqcrypto"
version = "400.1.0"
edition = "2021"
authors = ["CAMELOT Apex OS — Lukas_Omega"]
description = "Post-quantum cryptography for A2A channels — ML-KEM-768 (Kyber) + ML-DSA-65 (Dilithium)"

[[bin]]
name = "camelot-pqcrypto"
path = "src/main.rs"

[lib]
name = "camelot_pqcrypto"
path = "src/lib.rs"

[dependencies]
# NIST PQC standards (FIPS 203 / FIPS 204) via the maintained RustCrypto crates.
# Kyber768 = ML-KEM-768 (ml-kem), Dilithium3 = ML-DSA-65 (ml-dsa).
#
# P4-T04 (2026-06-28): migrated off the unmaintained `pqcrypto`/PQClean family
# to RustCrypto `ml-kem` 0.3.x + `ml-dsa` 0.1.x. Serialization uses the
# `EncodedSizeUser`/`EncodePrivateKey`/`EncodePublicKey` byte forms; RNG via
# `rand`. This clears the 9 ignored RustSec `unmaintained` advisories.
ml-kem        = { version = "0.3", features = ["getrandom"] }
ml-dsa        = { version = "0.1", features = ["getrandom"] }
crypto-common = "0.2"   # Key / KeyExport / KeyInit byte-serialization traits
hex       = "0.4"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow    = "1"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
