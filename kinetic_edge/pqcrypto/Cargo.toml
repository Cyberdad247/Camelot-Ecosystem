[package]
name = "camelot-pqcrypto"
version = "400.1.0"
edition = "2021"
authors = ["CAMELOT Apex OS — Lukas_Omega"]
description = "Post-quantum cryptography for A2A channels — ML-KEM-768 (Kyber) + ML-DSA-65 (Dilithium)"

[[bin]]
name = "camelot-pqcrypto"
path = "src/main.rs"

[lib]
name = "camelot_pqcrypto"
path = "src/lib.rs"

[dependencies]
# NIST PQC standards (FIPS 203 / FIPS 204) via stable pqcrypto bindings
# Kyber768 = ML-KEM-768, Dilithium3 = ML-DSA-65
pqcrypto        = { version = "0.17", features = ["pqcrypto-kyber", "pqcrypto-dilithium"] }
pqcrypto-traits = "0.3"
hex       = "0.4"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow    = "1"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
