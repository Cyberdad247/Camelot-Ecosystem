[package]
name = "camelot-pqcrypto"
version = "400.1.0"
edition = "2021"
authors = ["CAMELOT Apex OS — Lukas_Omega"]
description = "Post-quantum cryptography for A2A channels — ML-KEM-768 (Kyber) + ML-DSA-65 (Dilithium)"

[[bin]]
name = "camelot-pqcrypto"
path = "src/main.rs"

[lib]
name = "camelot_pqcrypto"
path = "src/lib.rs"

[dependencies]
# NIST PQC standards (FIPS 203 / FIPS 204)
ml-kem    = { version = "0.3", features = ["mlkem768"] }
ml-dsa    = { version = "0.3", features = ["mldsa65"] }
rand      = { version = "0.8", features = ["std"] }
rand_core = { version = "0.6", features = ["std"] }
hex       = "0.4"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize   = { version = "1", features = ["derive"] }
anyhow    = "1"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
