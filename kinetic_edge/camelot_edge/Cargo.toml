[package]
name = "camelot-edge"
version = "9000.14.0"
edition = "2021"
description = "CAMELOT edge WASM pill (P5-T01) — wasm32-wasip1 boot + health"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled"] }

[[bin]]
name = "camelot-edge"
path = "src/main.rs"
