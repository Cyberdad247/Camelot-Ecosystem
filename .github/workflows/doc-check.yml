# Camelot-OS Documentation Architecture CI Workflow (Reforged Baseline v4.1.0)

name: doc-check

on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/doc_check.py'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/doc_check.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install pyyaml

      - name: Execute Doc-Check Verification Gate
        run: |
          python scripts/doc_check.py run-all
