name: 'NPM Install'
description: 'Setup Node.js, cache npm dependencies, install, and optionally build for a standalone npm project'

inputs:
  working-directory:
    description: 'Path to the npm project directory'
    required: true
  package-json-path:
    description: 'Literal path to package.json for cache hashing (e.g., 02_FORGE/holotable/package.json)'
    required: true
  cache-key-prefix:
    description: 'Distinct cache key prefix for this project'
    required: true
  node-version:
    description: 'Node.js version'
    default: '20'
  build-command:
    description: 'Build command to run after install. Pass an empty string to skip.'
    default: 'npm run build'
  install-args:
    description: 'Extra arguments passed to npm install (e.g., --no-workspaces)'
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ${{ inputs.working-directory }}/node_modules
        key: ${{ runner.os }}-npm-${{ inputs.cache-key-prefix }}-${{ hashFiles(inputs.package-json-path) }}
        restore-keys: |
          ${{ runner.os }}-npm-${{ inputs.cache-key-prefix }}-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm install ${{ inputs.install-args }}

    - name: Build
      if: inputs.build-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}
