[package]
name = "camelot-transport"
version = "10001.0.0"
edition = "2021"
authors = ["CAMELOT Apex OS — Sir Helios & Sir Helio"]
description = "L2/L3 Bifrost Gateway Duplex Transport, SSE Telemetry & Pure HATEOAS Framing"

[dependencies]
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
blake3 = "1.5"
