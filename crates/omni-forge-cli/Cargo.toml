[package]
name = "omni-forge-cli"
version = "1.0.0"
edition = "2021"
authors = ["Sir Codex <codex@camelot.os>"]
description = "Bare-metal APEX Digital Factory CLI (arthurian-omni-forge) conforming to Rule 7 Hotpath Purity"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
