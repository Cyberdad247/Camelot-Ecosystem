[package]
name = "wasm-ledger-engine"
version = "1.0.0"
edition = "2021"
authors = ["Sir Codex <codex@camelot.os>"]
description = "Sovereign WASM Ledger Pill with offline-first double-entry CRDT logic"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
[workspace]
