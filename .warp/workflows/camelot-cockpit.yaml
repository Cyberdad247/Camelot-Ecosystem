---
name: Camelot Cockpit
description: Enter truthful Camelot cockpit mode in Warp from the repo root.
command: |
  cd C:\Users\vizio\CAMELOT_OS
  cmd /c .venv\Scripts\camelot.exe --json cockpit refresh
  powershell -NoExit -ExecutionPolicy Bypass -Command "$env:CAMELOT_COCKPIT_MODE='on'; Set-Location 'C:\Users\vizio\CAMELOT_OS'; if (Get-Command Enter-CamelotCockpit -ErrorAction SilentlyContinue) { Enter-CamelotCockpit } else { Write-Host 'Camelot cockpit mode active. Run camelot shell-setup --shell powershell to install prompt helpers.' -ForegroundColor Yellow }"
tags:
  - camelot
  - cockpit
  - warp
  - powershell
